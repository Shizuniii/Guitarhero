<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Guitarhero</title>
  <meta name="description" content="Dein Gitarren-Übungsprogramm mit Akkorden, Strums, Riffs, Songs, Aufnahmen und Stimmgerät.">
  <meta name="theme-color" content="#1f0f15">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preload" href="fonts/big-shoulders-display-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/atkinson-hyperlegible-next-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app"></div>
  <noscript>Guitarhero braucht JavaScript.</noscript>
  <script>
    // Rettung: Lassen sich die Programmdateien nicht laden (z. B. alte und neue Dateien gemischt im
    // Offline-Speicher), bliebe die Seite leer. Dann gibt es einen Knopf, der nur die Programmdateien neu lädt.
    // Pläne, Akkorde, Aufnahmen und Einstellungen liegen in der Datenbank und bleiben erhalten.
    (function () {
      // Bei jedem Start sofort nach einer neuen Version fragen, auch wenn der Rest nicht startet.
      try {
        if (navigator.serviceWorker && navigator.serviceWorker.getRegistration) {
          navigator.serviceWorker.getRegistration().then(function (r) { if (r) r.update().catch(function () {}); }).catch(function () {});
        }
      } catch (e) { /* ohne Service Worker egal */ }
      var failed = '';
      window.addEventListener('error', function (e) {
        if (!window.__ghStarted) { failed = (e && e.message) || 'Fehler beim Laden'; setTimeout(show, 300); }
      });
      setTimeout(show, 15000);
      function show() {
        if (window.__ghStarted || document.getElementById('rescue')) return;
        var box = document.createElement('div');
        box.id = 'rescue';
        box.setAttribute('role', 'alert');
        box.style.cssText = 'max-width:560px;margin:12vh auto;padding:24px;border:1px solid rgba(255,255,255,.18);border-radius:12px;background:rgba(0,0,0,.25);color:inherit;font:inherit;line-height:1.5';
        box.innerHTML = '<h1 style="margin:0 0 8px;font-size:1.6rem">Guitarhero startet nicht</h1>' +
          '<p style="margin:0 0 12px">Wahrscheinlich passen gespeicherte Programmdateien nach einem Update nicht zusammen. ' +
          'Der Knopf lädt nur die Programmdateien neu. Deine Pläne, Akkorde, Aufnahmen und Einstellungen bleiben erhalten.</p>' +
          '<button type="button" id="rescue-go" style="font:inherit;font-weight:700;padding:10px 16px;border-radius:8px;border:0;cursor:pointer">Programmdateien neu laden</button>' +
          '<p id="rescue-msg" style="margin:12px 0 0;opacity:.75;font-size:.9em"></p>';
        document.body.appendChild(box);
        if (failed) document.getElementById('rescue-msg').textContent = 'Technische Meldung: ' + failed;
        document.getElementById('rescue-go').onclick = repair;
      }
      function box() { return document.getElementById('rescue'); }
      function repair() {
        var btn = document.getElementById('rescue-go');
        btn.disabled = true;
        btn.textContent = 'Lade neu …';
        var sw = navigator.serviceWorker && navigator.serviceWorker.getRegistrations
          ? navigator.serviceWorker.getRegistrations().then(function (r) { return Promise.all(r.map(function (x) { return x.unregister(); })); })
          : Promise.resolve();
        sw.catch(function () {})
          .then(function () { return window.caches ? caches.keys().then(function (k) { return Promise.all(k.map(function (n) { return caches.delete(n); })); }) : 0; })
          .catch(function () {})
          // Auch den normalen Zwischenspeicher des Browsers auffrischen: jede Programmdatei einmal frisch holen
          .then(function () { return fetch('sw.js', { cache: 'reload' }).then(function (r) { return r.text(); }); })
          .then(function (t) {
            var m = t.match(/const FILES = (\[[\s\S]*?\]);/);
            var list = m ? JSON.parse(m[1]) : [];
            return Promise.all(list.map(function (f) { return fetch(f, { cache: 'reload' }).catch(function () {}); }));
          })
          .catch(function () {})
          .then(function () {
            // Ein Neuladen im selben Fenster nimmt in Chrome noch die alten Dateien aus dem Arbeitsspeicher.
            // Nach Schließen und Öffnen ist alles frisch.
            box().innerHTML = '<h1 id="rescue-done" style="margin:0 0 8px;font-size:1.6rem">Fertig</h1>' +
              '<p style="margin:0">Schließ Guitarhero jetzt ganz und öffne es wieder. Dann startet die neue Version.</p>';
          });
      }
    })();
  </script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
